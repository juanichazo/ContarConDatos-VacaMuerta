<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaca Muerta 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
</head>
<body>
<div class="pelicula"></div>
<div class="vineta"></div>
<div id="app">
  <header id="top">
    <div class="titulo">
      <h1>Vaca Muerta 2025</h1>
      <span class="sub">Producción, dueños, insumos y quema</span>
    </div>
    <div class="controles">
      <div class="seg" data-ctl="unit"><button data-v="fis">Unidades físicas</button><button data-v="usd">USD</button></div>
      <div class="seg" data-ctl="view"><button data-v="operador">Operador</button><button data-v="dueno">Dueños</button></div>
      <div class="seg" data-ctl="color"><button data-v="cat">Origen del capital</button><button data-v="grupo">Empresa</button></div>
    </div>
  </header>
  <main>
    <section id="mapwrap">
      <div id="map"></div>
      <div id="legend"></div>
      <details id="capas" open><summary>Capas y filtros</summary>
        <div class="col">
        <label><input type="checkbox" data-capa="areas" checked> Áreas</label>
        <label><input type="checkbox" data-capa="ductos"> Ductos y flujos nacionales</label>
        <label><input type="checkbox" data-capa="quema"> Quema (satélite)</label>
        <label>Tamaño <select id="tam"><option value="pet">Petróleo 2025</option><option value="gas">Gas 2025</option><option value="usd">Valor 2025 (USD)</option><option value="arena">Arena de fractura</option></select></label>
        <label>Empresa <select id="fEmp"><option value="">Todas</option></select></label>
        <label>País <select id="fPais"><option value="">Todos</option></select></label>
        </div>
      </details>
      <div id="tip" hidden></div>
    </section>
    <aside id="panel">
      <nav id="pasos"></nav>
      <div id="contenido"></div>
      <div id="navbtns"><button id="prev">Anterior</button><span id="pasoN"></span><button id="next">Siguiente</button></div>
    </aside>
  </main>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
